######################################################################
# Flow Calibration (Pressure-Advance auto-calibration) — Kobra S1
######################################################################
# Requires:
#   - klippy/extras/cs1237.py            -> [cs1237] section below
#   - klippy/extras/flow_calibration.py  -> [flow_calibration] section below
#
# The CS1237 strain-gauge ADC lives on the Anycubic toolhead MCU
# (nozzle_mcu), reached through the socat tunnel. The [cs1237] block below
# matches the stock Anycubic printer.cfg — keep it as-is unless your pins
# differ.
######################################################################

# --- CS1237 nozzle pressure sensor (handled by extras/cs1237.py) ----
# If your stock printer.cfg already has a [cs1237] section with these
# pins, you do NOT need to duplicate it — extras/cs1237.py makes that
# existing section load on vanilla Klipper.
[cs1237]
level_pin: nozzle_mcu:PA7
dout_pin:  nozzle_mcu:PA6
sclk_pin:  nozzle_mcu:PA5
register:  60
sensitivity: -2500
# The following are read but only used by the stock self-check/block paths
# (not by flow calibration); kept so the stock section loads cleanly.
head_block_sensitivity:     -300000
scratch_sensitivity:        -100000
self_check_sensitivity:     -400
block_filament_sensitivity: -3000


[flow_calibration]
# ---- Algorithm parameters ----
enable_dyna_PA: False        # vanilla applies a single static PA. Set True to
                             #   run the 3-speed sweep and apply its median.
pa_min: 0.015
pa_min_nozzled_comp: 0.01    # subtracted from pa_min for nozzles > 0.4 mm
pa_max: 0.075

# --- ABSOLUTE OUTPUT CALIBRATION (anchor each nozzle you use) -----------
# The interp_fit_factor table / FitVal heuristic are tuned to a measurement
# geometry that differs from the kinematic one used here, so the final PA value
# must be anchored to a real PA test print, ONCE PER NOZZLE SIZE:
#   1) run FLOW_CALIBRATE VERBOSE=1, note the K_raw value
#   2) print a PA tower to find the TRUE optimal PA for that nozzle
#   3) add  "<nozzle> <true_PA / K_raw>"  to nozzle_pa_scale below
# Example (0.6 PETG): K_raw ~0.019, print-optimal 0.045 -> 0.045/0.019 = 2.33
# Built-in defaults: 0.2=0.24 (estimate), 0.4=1.0 (placeholder),
#                    0.6=2.33 (measured), 0.8=4.18 (estimate).
# Override only the nozzles you actually measured:
nozzle_pa_scale:
    0.2, 0.24
    0.4, 1.0
    0.6, 2.33
    0.8, 4.18

pa_scale: 1.0                # fallback for nozzle sizes not listed above
delta_press_max: 60000
fit_val_max: 20000
cali_speed: 200              # default high-speed in mm/s (SPEED= overrides)
# Dwell (ms) after the high-speed phase so the MCU can measure the post-peak
# pressure decay (it samples at ~1280 Hz and needs ~200 samples / ~156 ms to
# set RealVal distinct from TargetVal). Too low -> dP=0 / pinned results.
measure_settle_ms: 250
# Repeat the sweep N times and apply the MEDIAN. Rejects the unstable first run
# right after a tool change (melt not yet conditioned). Override per run with
# RUNS=. 3 is a good robust default; 1 is fastest.
#measure_runs: 1

# --- Kinematic measurement moves ----
# Pressure advance is only applied to moves that ALSO move X or Y. The
# measurement therefore does a small X (or Y) zig-zag over the chute while
# extruding, long enough (~200 ms) for the MCU feature detector to gather
# enough samples (clear rise + fall). The high-speed move is the measured one.
measure_axis: X              # X or Y — pick the axis with room over the chute
measure_travel: 10           # mm of XY travel per move (must fit over the chute!)
low_extrude: 1               # mm E during the (preconditioning) low phase
low_move_ms: 80
high_extrude: 4              # mm E during the (measured) high phase
high_move_ms: 200            # duration of the measured move -> sample count
# If dP stays ~0: increase high_extrude (bigger PA pressure) and/or high_move_ms.
# If you get "Move exceeds maximum extrusion cross section": raise measure_travel
# or set [extruder] max_extrude_cross_section higher.

# ---- Interpolation table: 4 speeds (rows: 100/200/300/400 mm/s)
#                           x 5 temps (cols: 210/220/230/240/250 C) ----
# IMPORTANT: use the interp_fit_factor table AND fit_val_max from YOUR printer's
# own stock [flow_calibration] section (copy it off the printer via SSH).
# It is machine specific and gives the best accuracy + repeatability.
# The values below are only a generic reference fallback.
interp_fit_factor:
    0.359274009,   0.206184691,  0.169187327,  0.142158822,  0.159920083
    0.220970112,   0.131482745,  0.110646593,  0.094379512,  0.128922537
    -0.006382528, -0.09423983,  -0.05338325,  -0.076034839, -0.044459415
    -0.289944138, -0.228441364, -0.320433734, -0.279495245, -0.288081429

# ---- Macro hooks (defaults match the stock Kobra S1 macros) ----
# Override only if your macro names differ.
#home_macro: G28
#throw_position_macro: TO_THROW_POSITION
#cut_tip_macro: CUT_TIP
#ace_object_name: ace
#ace_change_tool_macro: ACE_CHANGE_TOOL TOOL={tool}
#ace_unload_macro: ACE_CHANGE_TOOL TOOL=-1
#ace_full_unload_macro: ACE_FULL_UNLOAD
# Feed assist keeps the ACE buffer pumped during the sweep so the toolhead
# extruder doesn't pull against the bowden.
#ace_feed_assist: True
#ace_feed_assist_on_macro: ACE_ENABLE_FEED_ASSIST T={tool}
#ace_feed_assist_off_macro: ACE_DISABLE_FEED_ASSIST T={tool}
#use_ace_change_tool: True       # True: let ACE_CHANGE_TOOL cut/unload/load/purge
                                 #   (recommended). False: manual sequence
                                 #   heat -> G28 -> CUT_TIP -> ACE_FULL_UNLOAD -> load
#wipe_gcode:
#    WIPE_ENTER
#    WIPE_STOP
#flush_poop_macro: FLUSH_POOP
#fan_on_template: M106 S{speed}  # nozzle/part fan ON (S0..S255)
#fan_off_macro: M106 S0
#prime_gcode:                    # rack-mode prime (no ACE)
#    G92 E0
#    G1 E10 F1000
# Pre-calibration prime + poop drop over the chute (ACE path), for a defined,
# pressurized melt before the sweep. Recommended, especially for >=0.6 nozzles.
#pre_cal_prime: True
# Option A (recommended): reuse your system's purge macro for the prime, so it
# matches the print-start/color-change purge behaviour. The macro should drop
# its own poop; we just return to the chute afterwards.
#pre_cal_prime_macro: PURGE_AND_POOP PURGELENGTH=40 PURGESPEED=300
# Option B (fallback, used when pre_cal_prime_macro is empty): raw extrude.
# Default 40 mm matches the print-start purge (filament is already loaded at the
# nozzle during flow cal, so the 85 mm full-load purge is not needed).
#prime_length: 40                # mm of fresh filament to prime
#prime_speed: 300                # mm/min
#pre_cal_flush: True             # drop the primed ooze (FLUSH_POOP) before sweep
#cooldown_temp: 0                # M104 S{cooldown_temp} after calibration (0 = off)
#z_hop: 5.0
#z_hop_speed: 10
#post_cal_poop_wipe: True        # drop poop + wipe + cooldown after calibration
#filament_sensor: filament_runout_nozzle   # toolhead sensor for rack-mode warning

# ---- Persist the result automatically (like cartographer / PID_CALIBRATE) ----
# When True, every successful FLOW_CALIBRATE stages the PA value via the Klipper
# SAVE_CONFIG mechanism; run SAVE_CONFIG afterwards to write it into the
# printer.cfg autosave block and restart. Override per run with SAVE=0 / SAVE=1.
#save_to_config: True            # default: every FLOW_CALIBRATE stages the
                                 #   result (SAVE_CONFIG banner appears). SAVE=0
                                 #   per run to skip.
#save_config_section: extruder
#save_config_option: pressure_advance

# ---- Live sensor output ----
# Print per-sample sensor values (dP, target/real/block, fit details) to the
# console during calibration. Override per run with VERBOSE=1 / VERBOSE=0.
#verbose: False
